<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Chat Viewer</title>
<style>
:root {
  --bg:#e5ddd5; --me:#dcf8c6; --other:#fff; --accent:#075E54;
}
* { box-sizing:border-box; font-family:Inter,Arial,sans-serif }
body { margin:0; background:var(--bg); height:100vh; display:flex; align-items:stretch; justify-content:center }
.app { width:100%; max-width:900px; background:#f6f5ef; display:flex; flex-direction:column; height:92vh; margin:20px; border-radius:10px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,0.1) }
.topbar { background:var(--accent); color:white; padding:14px 16px; font-weight:600 }
.chat-window { padding:18px; overflow:auto; flex:1; display:flex; flex-direction:column; gap:10px }
.system { align-self:center; background:transparent; color:#444; font-size:13px; padding:6px 10px; border-radius:6px }
.bubble-row { display:flex; align-items:flex-end; max-width:75% }
.bubble-row.me { align-self:flex-end; flex-direction:row-reverse }
.bubble-row.other { align-self:flex-start; }
.avatar { width:32px; height:32px; border-radius:50%; background:#bbb; margin:0 6px; display:flex; align-items:center; justify-content:center; font-size:14px; color:white; flex-shrink:0 }
.sender { font-size:12px; color:#2b2b2b; margin-bottom:4px; font-weight:600 }
.bubble { padding:10px 12px; border-radius:14px; word-wrap:break-word; white-space:pre-wrap; box-shadow:0 1px 0 rgba(0,0,0,0.06); background:var(--other); position:relative }
.bubble-row.me .bubble { background:var(--me) }
.bubble .ts { display:block; font-size:11px; color:#666; margin-top:6px; opacity:0.9 }
.media-placeholder { width:200px; height:120px; background:#ccc url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120"><rect width="200" height="120" fill="%23ccc"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="16" fill="%23666">Media omitted</text></svg>') center/contain no-repeat; border-radius:10px; margin-bottom:6px }
.composer { padding:10px 14px; font-size:13px; color:#444; background:#fff; border-top:1px solid rgba(0,0,0,0.04); text-align:center }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">WhatsApp Chat Viewer</header>
  <main class="chat-window" id="chat"></main>
  <footer class="composer">Chat dari export WhatsApp</footer>
</div>

// Replace tasya -> encaaaaaa💕
function replacetasya(s){ return s.replace(/\btasya\b/gi,"encaaaaaa💕"); }


function parseChat(text){
  let lines = text.split(/\r?\n/);
  let msgRe = /^\[([^\]]+)\]\s*(.*)$/;
  let messages = [];
  let buffer = null;

  for(let line of lines){
    if(!line.trim()) continue;

    let m = line.match(msgRe);

    if(m){
      let timestamp = m[1].trim();
      let rest = m[2].trim();

      if(buffer) messages.push(buffer);

      if(rest.includes(":")){
        let idx = rest.indexOf(":");
        let name = rest.slice(0,idx).trim();
        let txt = rest.slice(idx+1).trim();

        buffer = {
          timestamp,
          name,
          text: txt
        };
      } else {
        buffer = null;
        messages.push({
          timestamp,
          name: null,
          text: rest
        });
      }
    } else {
      if(buffer){
        buffer.text += "\n" + line;
      } else {
        messages.push({
          timestamp: "",
          name: null,
          text: line
        });
      }
    }
  }

  if(buffer) messages.push(buffer);

  return {messages};
}

function renderChat(messages){
  const win = document.getElementById("chat");
  win.innerHTML = "";

  for(let msg of messages){

    if(!msg.name){
      let div = document.createElement("div");
      div.className = "system";
      div.textContent = msg.text;
      win.appendChild(div);
      continue;
    }

    // Penentuan posisi berdasarkan nama asli pengirim
    let side = msg.name === "You" ? "me" : "other";

    let row = document.createElement("div");
    row.className = "bubble-row " + side;

    let avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = side === "me" ? "A" : "T";

    let bubble = document.createElement("div");
    bubble.className = "bubble";

    if(msg.text.includes("<Media omitted>")){
      let media = document.createElement("div");
      media.className = "media-placeholder";
      bubble.appendChild(media);
    }

    let txt = msg.text.replace("<Media omitted>","").trim();

    if(txt){
      let t = document.createElement("div");
      t.textContent = txt;
      bubble.appendChild(t);
    }

    let ts = document.createElement("div");
    ts.className = "ts";
    ts.textContent = msg.timestamp;
    bubble.appendChild(ts);

    if(side === "me"){
      row.appendChild(avatar);
      row.appendChild(bubble);
    } else {
      row.appendChild(avatar);

      let wrap = document.createElement("div");

      let sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = "Tasya";

      wrap.appendChild(sender);
      wrap.appendChild(bubble);
      row.appendChild(wrap);
    }

    win.appendChild(row);
  }
}

let {messages} = parseChat(rawChat);
renderChat(messages);

</script>
</body>
</html>
